name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'checks-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and types
        run: npm run lint && npm run typecheck
      - name: Image regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regression tests
        run: npx playwright test
      - name: WebKit compatibility and recovery
        run: npx playwright test --grep 'desktop: local Worker|20 pictures'
        env:
          PLAYWRIGHT_BROWSER: webkit
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: './test-results'
